<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -20 28 42">
  <!-- Bottom petals -->
  <ellipse cx="0" cy="8" rx="7" ry="13" fill="#F59E0B" transform="rotate(-30 0 8)" opacity="0.7"/>
  <ellipse cx="0" cy="8" rx="7" ry="13" fill="#F59E0B" transform="rotate(30 0 8)" opacity="0.7"/>
  <!-- Mid petals -->
  <ellipse cx="0" cy="4" rx="6" ry="14" fill="#D97706" transform="rotate(-60 0 4)" opacity="0.85"/>
  <ellipse cx="0" cy="4" rx="6" ry="14" fill="#D97706" transform="rotate(60 0 4)" opacity="0.85"/>
  <!-- Top center petal -->
  <ellipse cx="0" cy="-2" rx="7" ry="16" fill="#B45309"/>
  <!-- Small dot center -->
  <circle cx="0" cy="8" r="4" fill="#F59E0B"/>
  <!-- Body -->
  <ellipse cx="0" cy="5" rx="5" ry="6" fill="white" opacity="0.92"/>
  <!-- Head -->
  <circle cx="0" cy="-2" r="4" fill="white" opacity="0.92"/>
  <!-- Arms -->
  <line x1="-5" y1="5" x2="-9" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="5" y1="5" x2="9" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Hands -->
  <circle cx="-9" cy="9" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="9" cy="9" r="1.5" fill="white" opacity="0.9"/>
  <!-- Base line -->
  <line x1="-12" y1="13" x2="12" y2="13" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
</svg>
